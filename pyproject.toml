[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "prediccion-demanda-turistica-tdf"
version = "1.0.0"
description = "Modelo predictivo de demanda turística mensual para Tierra del Fuego — viajeros, pernoctaciones y visitas al Parque Nacional — mediante Regresión Lineal Múltiple sobre datos IPIEC y ERA5 (2004–2025)."
authors = [
  { name = "Darío Martínez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["parcial_aprendizaje2026"]
include = ["pyproject.toml", "parcial_aprendizaje2026/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["parcial_aprendizaje2026"]
force-sort-within-sections = true

